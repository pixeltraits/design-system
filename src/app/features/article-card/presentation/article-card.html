<div class="atop">
  <span class="atag">{{ tag() }}</span>
  <span
    class="aread"
    [class.aread--medium]="readTimeVariant() === 'medium'"
    [class.aread--long]="readTimeVariant() === 'long'"
  >{{ readTime() }}</span>
</div>
<div class="atitle">{{ title() }}</div>
<div class="aexcerpt">{{ excerpt() }}</div>
<div class="afooter">
  <span class="adate">{{ date() }}</span>
  <a class="alink" [href]="link()">Lire l'article →</a>
</div>
