server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets avec hash (JS, CSS, fonts, images) — cache 1 an immutable
    location ~* "\.[0-9a-f]{8,}\.(js|css|woff2?|ttf|svg|png|jpg|ico)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML et JSON — jamais en cache (Storybook regenere ces fichiers)
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;
}
